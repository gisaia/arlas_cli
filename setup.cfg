[metadata]
name = arlas_cli
description = ARLAS Command line for ARLAS Management
long_description = file:README-ARLAS-CLI-COMMANDS.md
long_description_content_type = text/markdown
author = Gisaïa
license = Apache License
version = arlas.cli.version

[options]
python_requires = >=3.10
packages = find:
py_modules = 
    arlas.cli.arlas_cloud
    arlas.cli.cli
    arlas.cli.collections
    arlas.cli.configurations
    arlas.cli.iam
    arlas.cli.index
    arlas.cli.model_infering
    arlas.cli.org
    arlas.cli.persist
    arlas.cli.readers
    arlas.cli.service
    arlas.cli.settings
    arlas.cli.user
    arlas.cli.utils
    arlas.cli.variables
install_requires = file:requirements.txt

[options.entry_points]
console_scripts =
    arlas_cli = arlas.cli.cli:main

[options.packages.find]
where = .
exclude =
    docs*
    scripts*
    tests*
    docker*
